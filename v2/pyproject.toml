[project]
name = "self-healing-devops-agent-v2"
version = "0.2.0"
description = "Sandboxed, bounded autonomous software repair vertical slice"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
ai = ["litellm>=1.50", "langgraph>=0.2"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
shda = "v2.app.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
