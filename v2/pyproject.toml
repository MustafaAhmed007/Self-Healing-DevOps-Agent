[project]
name = "self-healing-devops-agent"
version = "0.3.0"
description = "Sandboxed, bounded, evidence-driven autonomous software repair"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
ai = ["litellm>=1.50", "langgraph>=0.2"]
postgres = ["psycopg[binary]>=3.2"]
redis = ["redis>=5.0"]
observability = ["opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27"]
all = ["litellm>=1.50", "langgraph>=0.2", "psycopg[binary]>=3.2", "redis>=5.0", "opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
shda = "app.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

target-version = "py311"
