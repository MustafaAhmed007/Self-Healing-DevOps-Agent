name: v2-ci
on:
  push:
    paths: ["v2/**"]
  pull_request:
    paths: ["v2/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m evals.harness
