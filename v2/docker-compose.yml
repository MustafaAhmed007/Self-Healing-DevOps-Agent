services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://shda:${POSTGRES_PASSWORD:-local-only}@postgres:5432/shda
      REDIS_URL: redis://redis:6379/0
      EVIDENCE_DIR: /app/data/evidence
      SANDBOX_BACKEND: ${SANDBOX_BACKEND:-local}
      LLM_MODEL: ${LLM_MODEL:-ollama/llama3.2}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      AUTO_PUBLISH_PR: ${AUTO_PUBLISH_PR:-false}
    ports: ["8000:8000"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,size=64m]
    volumes: [evidence:/app/data/evidence]
    depends_on: [postgres, redis]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
  redis:
    image: redis:7-alpine
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shda
      POSTGRES_USER: shda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U shda -d shda"]
      interval: 10s
      timeout: 5s
      retries: 5
  console:
    build: ./console
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
volumes:
  pgdata:
  evidence:
