[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-devops-agent"
version = "0.3.0"
description = "Sandboxed AI coding agent for autonomous software repair with evidence-backed verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]
ai = ["litellm>=1.50", "langgraph>=0.2"]
postgres = ["psycopg[binary]>=3.2"]
redis = ["redis>=5.0"]
observability = ["opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27"]
all = ["litellm>=1.50", "langgraph>=0.2", "psycopg[binary]>=3.2", "redis>=5.0", "opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27"]

[project.scripts]
shda = "app.cli:main"
shda-install = "install:main"

[tool.setuptools]
package-dir = {"" = "v2"}
py-modules = ["install"]

[tool.setuptools.packages.find]
where = ["v2"]
include = ["app*", "evals*"]
exclude = ["console*"]

[tool.pytest.ini_options]
testpaths = ["v2/tests"]
pythonpath = ["v2"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "PLW1510", "S110"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_return_any = true
